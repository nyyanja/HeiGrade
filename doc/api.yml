openapi: 3.0.3
info:
  title: HeiGrade API
  description: >
    API REST de HeiGrade, une application de gestion scolaire (HEI) permettant
    de gérer les utilisateurs (admins, enseignants, étudiants), les promotions,
    spécialités, groupes, cours, examens, notes, historiques de notes,
    bulletins (transcripts) et le suivi des diplômés.
  version: "1.0.0"
  contact:
    name: HEI
servers:
  - url: http://localhost:8080
    description: Serveur local de développement

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentification (connexion, génération de token JWT)
  - name: Users
    description: Gestion générique des utilisateurs
  - name: Admins
    description: Gestion des administrateurs
  - name: Teachers
    description: Gestion des enseignants
  - name: Students
    description: Gestion des étudiants
  - name: Promotions
    description: Gestion des promotions
  - name: Specialities
    description: Gestion des spécialités
  - name: SpecialityCourses
    description: Association spécialité / cours
  - name: Courses
    description: Gestion des cours
  - name: TeacherCourses
    description: Association enseignant / cours
  - name: Groups
    description: Gestion des groupes d'étudiants
  - name: GroupExams
    description: Association groupe / examen
  - name: Exams
    description: Gestion des examens
  - name: Grades
    description: Gestion des notes
  - name: StudentGroupHistories
    description: Historique d'appartenance des étudiants aux groupes
  - name: Transcripts
    description: Bulletins de notes (relevés) des étudiants
  - name: Graduates
    description: Suivi des diplômés et classement
  - name: Health
    description: Points de contrôle techniques (santé de l'application)

paths:
  # ============================================================
  # AUTH
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Authentifier un utilisateur
      description: Authentifie un utilisateur avec son email et son mot de passe, et retourne un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # USERS
  # ============================================================
  /users:
    get:
      tags: [Users]
      summary: Lister tous les utilisateurs
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Créer un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Users]
      summary: Récupérer un utilisateur par son id
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Mettre à jour un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Supprimer un utilisateur
      responses:
        '204':
          description: Utilisateur supprimé

  /users/role/{role}:
    get:
      tags: [Users]
      summary: Lister les utilisateurs par rôle
      parameters:
        - name: role
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Liste des utilisateurs ayant le rôle donné
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/name/{name}:
    get:
      tags: [Users]
      summary: Rechercher des utilisateurs par nom
      parameters:
        - $ref: '#/components/parameters/NamePath'
      responses:
        '200':
          description: Liste des utilisateurs correspondants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/group/{groupId}:
    get:
      tags: [Users]
      summary: Lister les utilisateurs appartenant à un groupe
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des utilisateurs du groupe
          content:
