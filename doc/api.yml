      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Classement des diplômés de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraduateRanking'

  /graduates/promotion/{promotionId}/export:
    get:
      tags: [Graduates]
      summary: Exporter le classement des diplômés d'une promotion vers Excel
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: URL du fichier Excel généré (lien de téléchargement)
          content:
            application/json:
              schema:
                type: string
                format: uri

  # ============================================================
  # HEALTH (endpoints techniques du framework poja)
  # ============================================================
  /ping:
    get:
      tags: [Health]
      summary: Vérifier que l'application répond
      security: []
      responses:
        '200':
          description: L'application répond
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /health/db:
    get:
      tags: [Health]
      summary: Vérifier la connexion à la base de données
      security: []
      responses:
        '200':
          description: Base de données accessible (OK) ou non (KO)
          content:
            text/plain:
              schema:
                type: string
                enum: [OK, KO]

  /health/bucket:
    get:
      tags: [Health]
      summary: Vérifier l'accès au bucket de stockage de fichiers
      security: []
      responses:
        '200':
          description: URL pré-signée du fichier de test uploadé
          content:
            text/plain:
              schema:
                type: string

  /health/email:
    get:
      tags: [Health]
      summary: Vérifier l'envoi d'emails
      security: []
      parameters:
        - name: to
          in: query
          required: true
          description: Adresse email de destination des emails de test
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Emails envoyés avec succès
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /health/event1:
    get:
      tags: [Health]
      summary: Vérifier le traitement des événements (type 1)
      security: []
      parameters:
        - $ref: '#/components/parameters/NbEventQuery'
        - $ref: '#/components/parameters/WaitInSecondsQuery'
      responses:
        '200':
          description: Liste des UUID des événements générés
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid

  /health/event2:
    get:
      tags: [Health]
      summary: Vérifier le traitement des événements (type 2)
      security: []
      parameters:
        - $ref: '#/components/parameters/NbEventQuery'
        - $ref: '#/components/parameters/WaitInSecondsQuery'
      responses:
        '200':
          description: Liste des UUID des événements générés
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid

  /health/event/uuids:
    post:
      tags: [Health]
      summary: Vérifier que des UUID d'événements ont bien été persistés
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: Tous les UUID ont été trouvés (OK) ou non (KO)
          content:
            text/plain:
              schema:
                type: string
                enum: [OK, KO]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT obtenu via `POST /auth/login`, à transmettre dans l'en-tête
        `Authorization: Bearer <token>`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identifiant unique (UUID) de la ressource
      schema:
        type: string
        format: uuid
    NamePath:
      name: name
      in: path
      required: true
      description: Nom (ou fragment de nom) recherché
      schema:
        type: string
    StudentIdPath:
      name: studentId
      in: path
      required: true
      description: Identifiant unique (UUID) de l'étudiant
      schema:
        type: string
        format: uuid
    CourseIdPath:
      name: courseId
      in: path
      required: true
      description: Identifiant unique (UUID) du cours
      schema:
        type: string
        format: uuid
    ExamIdPath:
      name: examId
      in: path
      required: true
      description: Identifiant unique (UUID) de l'examen
      schema:
        type: string
        format: uuid
    SpecialityIdPath:
      name: specialityId
      in: path
      required: true
      description: Identifiant unique (UUID) de la spécialité
      schema:
        type: string
        format: uuid
    NbEventQuery:
      name: nbEvent
      in: query
      required: false
      description: Nombre d'événements à générer (entre 1 et 500)
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 500
    WaitInSecondsQuery:
      name: waitInSeconds
      in: query
      required: false
      description: Délai (en secondes) avant traitement de l'événement
      schema:
        type: integer
        default: 2

  responses:
    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentification requise ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Accès refusé (rôle insuffisant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
        path:
          type: string

    Role:
      type: string
      description: Rôle de l'utilisateur dans l'application
      enum: [TEACHER, STUDENT, ADMIN]

    Sex:
      type: string
      description: Sexe de l'utilisateur
      enum: [MALE, FEMALE]

    GroupSpeciality:
      type: string
      description: Nom de la spécialité d'un groupe
      enum: [EL, TN, COMMON_PART]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT à utiliser pour les appels authentifiés

    CreateUserRequest:
      type: object
      description: Requête de création d'un utilisateur générique
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      description: Utilisateur de base (admin, enseignant ou étudiant)
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
        birthday:
          type: string
          format: date
        sex:
          $ref: '#/components/schemas/Sex'
        address:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    Admin:
      description: Administrateur (hérite de User)
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            adminReference:
              type: string

    Teacher:
      description: Enseignant (hérite de User)
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            speciality:
              type: string
              description: Spécialité d'enseignement du professeur

    Student:
      description: Étudiant (hérite de User)
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            reference:
              type: string
              description: Référence/matricule unique de l'étudiant
            group:
              $ref: '#/components/schemas/Group'

    Promotion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        year:
          type: integer

    Speciality:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          $ref: '#/components/schemas/GroupSpeciality'

    SpecialityCourse:
      type: object
      description: Association entre une spécialité et un cours
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        speciality:
          $ref: '#/components/schemas/Speciality'
        course:
          $ref: '#/components/schemas/Course'

    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
        title:
          type: string
        credit:
          type: integer
        level:
          type: integer
          description: Niveau du cours (1 = L1, 2 = L2, 3 = L3)
        teachers:
          type: array
          items:
            $ref: '#/components/schemas/Teacher'
        specialities:
          type: array
          items:
            $ref: '#/components/schemas/Speciality'

    TeacherCourse:
      type: object
      description: Association entre un enseignant et un cours
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        teacher:
          $ref: '#/components/schemas/Teacher'
        course:
          $ref: '#/components/schemas/Course'

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        promotion:
          $ref: '#/components/schemas/Promotion'
        speciality:
          $ref: '#/components/schemas/Speciality'
        students:
          type: array
          items:
            $ref: '#/components/schemas/Student'

    GroupExam:
      type: object
      description: Association entre un groupe et un examen
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        group:
          $ref: '#/components/schemas/Group'
        exam:
          $ref: '#/components/schemas/Exam'

    Exam:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        coeff:
          type: number
          format: double
          description: Coefficient de l'examen (la somme des coefficients des examens d'un cours ne doit pas dépasser 1)
        title:
          type: string
        course:
          $ref: '#/components/schemas/Course'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'

    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        value:
          type: number
          format: double
          description: Valeur de la note (généralement entre 0 et 20)
        date:
          type: string
          format: date
        student:
          $ref: '#/components/schemas/Student'
        exam:
          $ref: '#/components/schemas/Exam'

    GradeHistory:
      type: object
      description: Historique d'une modification de note
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date-time
        oldValue:
          type: number
          format: double
        newValue:
          type: number
          format: double
        reason:
          type: string
        grade:
          $ref: '#/components/schemas/Grade'
        modifiedBy:
          $ref: '#/components/schemas/User'

    StudentGroupHistory:
      type: object
      description: Historique d'appartenance d'un étudiant à un groupe
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        student:
          $ref: '#/components/schemas/Student'
        group:
          $ref: '#/components/schemas/Group'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true

    TranscriptCourseLine:
      type: object
      description: Ligne de cours dans un bulletin de notes
      properties:
        courseId:
          type: string
          format: uuid
        reference:
          type: string
        title:
          type: string
        credit:
          type: integer
        average:
          type: number
          format: double
        obtainedCredit:
          type: integer

    Transcript:
      type: object
      description: Bulletin de notes (relevé) d'un étudiant pour un niveau donné
      properties:
        studentId:
          type: string
          format: uuid
        reference:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        level:
          type: integer
          description: Niveau du bulletin (1, 2 ou 3)
        courses:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptCourseLine'
        generalAverage:
          type: number
          format: double
        totalCredit:
          type: integer

    GraduateStatus:
      type: object
      description: Statut de diplomation d'un étudiant
      properties:
        studentId:
          type: string
          format: uuid
        reference:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        graduated:
          type: boolean
        totalCredit:
          type: integer
        generalAverage:
          type: number
          format: double
        l1Credit:
          type: integer
        l2Credit:
          type: integer
        l3Credit:
          type: integer
        l1Average:
          type: number
          format: double
        l2Average:
          type: number
          format: double
        l3Average:
          type: number
          format: double

    GraduateRanking:
      type: object
      description: Classement d'un étudiant diplômé dans sa promotion
      properties:
        rank:
          type: integer
        studentId:
          type: string
          format: uuid
        reference:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        generalAverage:
          type: number
          format: double
        totalCredit:
          type: integer